<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reconocimiento de Dígitos MNIST</title>
  <style>
    :root {
      --bg: #0e1117;
      --card: #161b22;
      --border: #30363d;
      --text: #f0f6fc;
      --muted: #8b949e;
      --primary: #ff4b4b;
      --primary-hover: #ff3333;
      --success-bg: #122b1d;
      --success-text: #3fb950;
      --error-bg: #331618;
      --error-text: #f85149;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; padding: 24px; background: var(--bg); color: var(--text);
      display: flex; justify-content: center;
    }
    .container { width: 100%; max-width: 1050px; }
    h1 { margin: 0 0 14px; font-size: 1.9rem; }
    .tabs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .tab-btn {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 0.95rem;
    }
    .tab-btn.active { border-color: var(--primary); background: #26171a; font-weight: 600; }
    hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0 22px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
    @media (max-width: 780px) { .grid { grid-template-columns: 1fr; } }
    .panel {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
    }
    .panel h2 { margin: 0 0 14px; font-size: 1.2rem; }
    .canvas-wrap { display: flex; justify-content: center; margin-bottom: 14px; }
    canvas#pizarra {
      background: #000; border: 2px solid var(--border); border-radius: 8px;
      touch-action: none; cursor: crosshair;
    }
    .btn-row { display: flex; gap: 10px; }
    .btn {
      flex: 1; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: #21262d; color: var(--text); font-size: 0.95rem; cursor: pointer; font-weight: 600;
    }
    .btn:hover { background: #30363d; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: 0.6; cursor: wait; }
    .hidden { display: none !important; }
    input[type="file"], select {
      width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px;
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
    }
    .preview-box { text-align: center; margin: 10px 0 14px; }
    .preview-box img { max-width: 170px; max-height: 170px; border-radius: 8px; border: 1px solid var(--border); }
    .cam-wrap {
      position: relative; width: 100%; max-width: 300px; margin: 0 auto 14px;
      border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: #000;
    }
    video#cam-video { width: 100%; display: block; }
    .cam-guide {
      position: absolute; top: 20%; left: 20%; width: 60%; height: 60%;
      border: 2px dashed rgba(255, 255, 255, 0.75); pointer-events: none;
    }
    .res-top { display: flex; gap: 18px; align-items: center; margin-bottom: 18px; }
    .mnist-thumb {
      width: 112px; height: 112px; background: #000; border: 1px solid var(--border);
      border-radius: 8px; image-rendering: pixelated;
    }
    .alert { padding: 14px; border-radius: 8px; font-size: 1rem; margin-bottom: 8px; }
    .alert-success { background: var(--success-bg); color: var(--success-text); border: 1px solid #238636; }
    .alert-error { background: var(--error-bg); color: var(--error-text); border: 1px solid #da3633; }
    .alert-info { background: #13233a; color: #58a6ff; border: 1px solid #1f6feb; }
    .metric-val { font-size: 1.7rem; font-weight: 700; margin-top: 4px; }
    .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 0.85rem; }
    .bar-label { width: 16px; text-align: right; color: var(--muted); }
    .bar-track { flex: 1; height: 12px; background: #21262d; border-radius: 6px; overflow: hidden; }
    .bar-fill { height: 100%; background: #58a6ff; transition: width 0.25s ease; }
    .bar-pct { width: 48px; text-align: right; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Reconocimiento de Dígitos MNIST</h1>
    <div class="tabs">
      <button class="tab-btn active" onclick="cambiarModo('pizarra', this)">✍️ Pizarra Digital</button>
      <button class="tab-btn" onclick="cambiarModo('subir', this)">📁 Subir Imagen</button>
      <button class="tab-btn" onclick="cambiarModo('camara', this)">📸 Tomar Foto</button>
    </div>
    <hr />

    <div class="grid">
      <!-- COLUMNA IZQUIERDA -->
      <div class="panel">
        <!-- MODO 1: PIZARRA -->
        <div id="sec-pizarra">
          <h2>Dibuja un dígito (0-9)</h2>
          <div class="canvas-wrap">
            <canvas id="pizarra" width="260" height="260"></canvas>
          </div>
          <div class="btn-row">
            <button class="btn btn-primary" id="btn-pred-pizarra" onclick="predecirPizarra()">🔍 Predecir</button>
            <button class="btn" onclick="limpiarPizarra()">🗑️ Borrar pizarra</button>
          </div>
        </div>

        <!-- MODO 2: SUBIR IMAGEN -->
        <div id="sec-subir" class="hidden">
          <h2>Sube una imagen</h2>
          <input type="file" id="file-input" accept="image/png, image/jpeg, image/jpg" onchange="cargarArchivo(event)" />
          <label style="font-size:0.85rem; color:var(--muted);">Tipo de fondo:</label>
          <select id="modo-fondo">
            <option value="Automático">Automático</option>
            <option value="Fondo oscuro / número claro">Fondo oscuro / número claro</option>
            <option value="Fondo claro / número oscuro">Fondo claro / número oscuro</option>
          </select>
          <div id="preview-wrap" class="preview-box hidden">
            <img id="img-preview" src="" alt="Vista previa" />
          </div>
          <button class="btn btn-primary" id="btn-pred-archivo" onclick="predecirArchivo()">🔍 Predecir Imagen</button>
        </div>

        <!-- MODO 3: CÁMARA -->
        <div id="sec-camara" class="hidden">
          <h2>Captura con cámara</h2>
          <p style="font-size:0.85rem; color:var(--muted); margin-top:0;">Centra el número dentro del recuadro punteado:</p>
          <div class="cam-wrap">
            <video id="cam-video" autoplay playsinline></video>
            <div class="cam-guide"></div>
          </div>
          <button class="btn btn-primary" id="btn-pred-camara" onclick="predecirCamara()">🔍 Capturar y Predecir</button>
        </div>
      </div>

      <!-- COLUMNA DERECHA -->
      <div class="panel">
        <h2>Resultado de la Predicción</h2>
        <div id="res-placeholder" class="alert alert-info">
          Dibuja, sube una imagen o toma una foto a la izquierda y presiona <strong>Predecir</strong>.
        </div>

        <div id="res-contenido" class="hidden">
          <div class="res-top">
            <div style="text-align:center;">
              <img id="img-28" class="mnist-thumb" src="" alt="28x28" />
              <div style="font-size:0.78rem; color:var(--muted); margin-top:4px;">Entrada (28x28 px)</div>
            </div>
            <div style="flex:1;" id="res-estado"></div>
          </div>
          <div style="font-weight:600; font-size:0.9rem; margin-bottom:8px;">Probabilidad por clase (0-9):</div>
          <div id="barras-prob"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- LÓGICA DE PIZARRA (MOUSE + TÁCTIL) ---
    const canvas = document.getElementById("pizarra");
    const ctx = canvas.getContext("2d");
    let dibujando = false;

    function limpiarPizarra() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    limpiarPizarra();

    function obtenerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clienteX = e.touches ? e.touches[0].clientX : e.clientX;
      const clienteY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clienteX - rect.left) * (canvas.width / rect.width),
        y: (clienteY - rect.top) * (canvas.height / rect.height)
      };
    }

    function iniciarTrazo(e) {
      e.preventDefault();
      dibujando = true;
      const pos = obtenerPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.lineTo(pos.x + 0.1, pos.y + 0.1);
      trazar(e);
    }

    function trazar(e) {
      if (!dibujando) return;
      e.preventDefault();
      const pos = obtenerPos(e);
      ctx.lineWidth = 26;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#FFFFFF";
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function terminarTrazo() { dibujando = false; }

    canvas.addEventListener("mousedown", iniciarTrazo);
    canvas.addEventListener("mousemove", trazar);
    window.addEventListener("mouseup", terminarTrazo);
    canvas.addEventListener("touchstart", iniciarTrazo, { passive: false });
    canvas.addEventListener("touchmove", trazar, { passive: false });
    canvas.addEventListener("touchend", terminarTrazo);

    // --- CAMBIO DE PESTAÑAS Y CONTROL DE CÁMARA ---
    let streamCamara = null;

    async function cambiarModo(modo, btn) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      document.getElementById("sec-pizarra").classList.add("hidden");
      document.getElementById("sec-subir").classList.add("hidden");
      document.getElementById("sec-camara").classList.add("hidden");
      document.getElementById("sec-" + modo).classList.remove("hidden");

      if (modo === "camara") {
        try {
          streamCamara = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
          document.getElementById("cam-video").srcObject = streamCamara;
        } catch (err) {
          alert("No se pudo acceder a la cámara. Verifica los permisos del navegador.");
        }
      } else if (streamCamara) {
        streamCamara.getTracks().forEach(t => t.stop());
        streamCamara = null;
      }
    }

    // --- CARGA DE ARCHIVO ---
    let imagenArchivoB64 = null;
    function cargarArchivo(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        imagenArchivoB64 = ev.target.result;
        document.getElementById("img-preview").src = imagenArchivoB64;
        document.getElementById("preview-wrap").classList.remove("hidden");
      };
      reader.readAsDataURL(file);
    }

    // --- ENVIAR AL BACKEND ---
    async function enviarPrediccion(payload, btnId) {
      const btn = document.getElementById(btnId);
      const textoOrig = btn.innerText;
      btn.disabled = true;
      btn.innerText = "⏳ Procesando...";

      try {
        const res = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        mostrarResultado(data);
      } catch (err) {
        alert("Error de conexión con el servidor.");
      } finally {
        btn.disabled = false;
        btn.innerText = textoOrig;
      }
    }

    function predecirPizarra() {
      enviarPrediccion({
        image: canvas.toDataURL("image/png"),
        es_dibujo: true,
        es_camara: false
      }, "btn-pred-pizarra");
    }

    function predecirArchivo() {
      if (!imagenArchivoB64) { alert("Selecciona primero una imagen."); return; }
      enviarPrediccion({
        image: imagenArchivoB64,
        es_dibujo: false,
        es_camara: false,
        modo_color: document.getElementById("modo-fondo").value
      }, "btn-pred-archivo");
    }

    function predecirCamara() {
      const video = document.getElementById("cam-video");
      if (!video.videoWidth) { alert("La cámara aún no está lista."); return; }
      const tempCanvas = document.createElement("canvas");
      tempCanvas.width = video.videoWidth;
      tempCanvas.height = video.videoHeight;
      tempCanvas.getContext("2d").drawImage(video, 0, 0);
      enviarPrediccion({
        image: tempCanvas.toDataURL("image/jpeg", 0.9),
        es_dibujo: false,
        es_camara: true,
        modo_color: "Automático"
      }, "btn-pred-camara");
    }

    function mostrarResultado(data) {
      document.getElementById("res-placeholder").classList.add("hidden");
      document.getElementById("res-contenido").classList.remove("hidden");
      if (data.img_28) document.getElementById("img-28").src = data.img_28;

      const estado = document.getElementById("res-estado");
      const barras = document.getElementById("barras-prob");
      barras.innerHTML = "";

      if (data.vacio) {
        estado.innerHTML = `<div class="alert alert-error">⚠️ ${data.mensaje}</div>`;
        return;
      }

      if (!data.es_valido) {
        estado.innerHTML = `
          <div class="alert alert-error">❌ <strong>${data.mensaje_error}</strong></div>
          <div style="font-size:0.82rem; color:var(--muted);">Confianza máx: ${data.confianza}% | Margen: ${data.margen}%</div>
        `;
      } else {
        estado.innerHTML = `
          <div class="alert alert-success">Dígito detectado: <strong style="font-size:1.3rem;">${data.digito}</strong></div>
          <div style="font-size:0.85rem; color:var(--muted);">Confianza</div>
          <div class="metric-val">${data.confianza}%</div>
        `;
      }

      data.probabilidades.forEach((pct, idx) => {
        barras.innerHTML += `
          <div class="bar-row">
            <span class="bar-label">${idx}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <span class="bar-pct">${pct.toFixed(1)}%</span>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
